name: Catalog

# Rebuilds every site's catalog (title + series URL) nightly and publishes
# the files on the orphan `catalog-data` branch, which the app and the CLI
# download from (catalog.BaseURL). Like `star-tracker-data`, the branch is
# orphan so generated data never buries real commits on master.
#
# `catalog crawl` exits 2 when a site failed or its old file was kept (the
# half-size guard); what worked is still committed. The failed sites are
# listed in the job summary, and the job goes red only when more than half
# of the sites failed (the sites' markup drifting one by one is normal).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-data

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build -o bin/manga-downloader .

      - name: Check out the data branch
        run: |
          if git fetch origin catalog-data:catalog-data 2>/dev/null; then
            git worktree add data catalog-data
          else
            git worktree add --detach data
            cd data
            git checkout --orphan catalog-data
            git rm -rfq . || true
          fi
          mkdir -p data/catalog

      - name: Crawl
        id: crawl
        run: |
          set +e
          bin/manga-downloader catalog crawl --out data/catalog 2>&1 | tee crawl.log
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          written=$(grep -cE '^[a-z0-9.-]+  [0-9]+ entries' crawl.log)
          failed=$(grep -cE '^[a-z0-9.-]+  (FAIL|kept)' crawl.log)
          echo "written=$written" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "## $written sites written, $failed failed or kept"
            echo
            if [ "$failed" -gt 0 ]; then
              echo '```'
              grep -E '^[a-z0-9.-]+  (FAIL|kept)' crawl.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Index and gzip
        run: bin/manga-downloader catalog index --gzip --out data/catalog

      - name: Commit
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A catalog
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          total=$(python3 -c 'import json; print(sum(s["entries"] for s in json.load(open("catalog/index.json"))["sites"]))')
          sites=$(python3 -c 'import json; print(len(json.load(open("catalog/index.json"))["sites"]))')
          git commit -qm "Update catalog: $total entries, $sites sites"
          git push origin HEAD:catalog-data

      - name: Fail when most sites failed
        run: |
          written=${{ steps.crawl.outputs.written }}
          failed=${{ steps.crawl.outputs.failed }}
          if [ "$written" -eq 0 ] || [ "$failed" -gt "$written" ]; then
            echo "::error::$failed sites failed, $written written"
            exit 1
          fi
